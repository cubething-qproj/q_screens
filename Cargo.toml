[package]
name = "q_screens"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cubething-qproj/q_screens"
description = "Screens extension for bevy"

[dependencies]
# bevy
bevy = { version = "0.19", default-features = false, features = ["default_app", "bevy_window"] }
# 0.12.2 uses syn 3, while Bevy's macro utilities use syn 2.
encase = "=0.12.1"

# not bevy
tiny_bail = "0.7"
thiserror = "2.0.12"
strum = { version = "0.27.2", features = ["derive"] }

[dev-dependencies]
bevy_asset_loader = "0.27"
itertools = "0.14.0"

# local
q_test_harness = { git = "https://github.com/cubething-qproj/q_test_harness", version = "^0.1" }

[features]
dylib = ["bevy/dynamic_linking"]
# Register the persistent types spawned by these Bevy crates (see `PersistentTypes`).
bevy_gilrs = ["bevy/bevy_gilrs"]
bevy_picking = ["bevy/bevy_picking"]

[lints]
clippy.too_many_arguments = "allow"
clippy.type_complexity = "allow"
clippy.nonstandard_macro_braces = "warn"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[profile.dist]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"


